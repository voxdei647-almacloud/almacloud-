server {
    listen 80;
    server_name localhost;

    client_max_body_size 50M;

    # Encabezados de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Resolver DNS interno de Docker para resolución dinámica de upstreams
    resolver 127.0.0.11 valid=30s;

    # Ruta de salud de Nginx
    location /nginx-health {
        access_log off;
        return 200 'healthy';
    }

    # Redirección de endpoints del Backend FastAPI
    location ~ ^/(api|healthz|docs|openapi.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Ruta principal (Backend por defecto mientras se despliega el Frontend)
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
